--g:linear-gradient(180deg,rgba(255,255,255,.11),rgba(255,255,255,.04));--gs:inset 0 1px 0 rgba(255,255,255,.24),inset 0 -1px 0 rgba(255,255,255,.04),0 10px 30px rgba(0,0,0,.28);--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,"SF Pro Display","SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.fx{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.fx:before,.fx:after{content:"";position:absolute;border-radius:50%;filter:blur(70px);animation:dr 20s ease-in-out infinite alternate}
.fx:before{width:340px;height:340px;left:-110px;top:-60px;background:rgba(46,184,150,.42)}
.fx:after{width:300px;height:300px;right:-120px;top:42%;background:rgba(74,124,240,.34);animation-duration:26s}
@keyframes dr{to{transform:translate(50px,70px) scale(1.12)}}
#app{position:relative;z-index:1;max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.top{height:calc(var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px) + 10px)}
.chip,.card,.pk,.seg,input,textarea,.btn.g,#toast,.nb,.pl{background:var(--g);border:1px solid var(--line);box-shadow:var(--gs);-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%)}
main{flex:1;padding:6px 16px 120px}
.in>*{animation:rise .55s var(--ease) both}.in>:nth-child(2){animation-delay:.06s}.in>:nth-child(3){animation-delay:.12s}.in>:nth-child(4){animation-delay:.18s}.in>:nth-child(5){animation-delay:.24s}.in>:nth-child(n+6){animation-delay:.3s}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.05)}100%{transform:scale(1)}}
h1{font-size:24px;font-weight:700;letter-spacing:-.4px;margin:2px 0}h2{font-size:19px;font-weight:700;letter-spacing:-.3px;margin:8px 4px 12px}h3{font-size:13px;color:var(--t2);font-weight:600;margin-bottom:6px}
.sub{color:var(--t2);font-size:13px}.card{border-radius:26px;padding:16px 18px;margin-bottom:12px}
.pills{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 14px;padding:2px 16px 6px}.pills::-webkit-scrollbar{display:none}
.pl{flex:none;border-radius:99px;padding:9px 16px;color:var(--t2);font:600 14px inherit;font-family:inherit;cursor:pointer;transition:transform .15s}
.pl.on{color:var(--dk);background:linear-gradient(180deg,#5fe3c2,#2eb896);border-color:transparent;box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 6px 18px rgba(46,184,150,.35);animation:pop .35s var(--ease)}
.hero{display:flex;gap:16px;align-items:center;margin:8px 4px 18px}
.av{width:68px;height:68px;border-radius:50%;flex:none;background:linear-gradient(135deg,var(--fill),var(--blue)) center/cover;display:grid;place-items:center;font-size:28px;font-weight:700;color:#fff;border:2px solid rgba(255,255,255,.28);box-shadow:0 8px 24px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.4)}
.ci{display:inline-block;width:1.15em;height:1.15em;background:var(--coin) center/contain no-repeat;vertical-align:-.2em;flex:none;filter:drop-shadow(0 3px 8px rgba(255,140,0,.35))}
.pb{display:inline-grid;place-items:center;width:1.5em;height:1.5em;border-radius:.5em;background:linear-gradient(135deg,#e0b04a,#e2716a);font-size:.8em;flex:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.main-num{background:linear-gradient(180deg,rgba(79,214,180,.2),rgba(79,214,180,.06));border-color:rgba(79,214,180,.4)}
.big{font-size:27px;font-weight:700;letter-spacing:.3px;font-variant-numeric:tabular-nums;word-break:break-all}
.item,.pr,.sw{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-top:1px solid rgba(255,255,255,.08);cursor:pointer;font-variant-numeric:tabular-nums;transition:opacity .15s}
.item:first-child,.pr:first-child,.sw:first-child{border-top:0}.item i{font-style:normal;color:var(--t3);font-size:12px}.pr b{color:var(--ac)}.item:active,.pr:active{opacity:.55}
.ped{padding:0 0 12px;animation:rise .3s var(--ease)}.ped .btn{margin-top:8px}
.sw i{width:50px;height:30px;border-radius:99px;background:rgba(255,255,255,.14);position:relative;transition:background .25s;flex:none}
.sw i:after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.35);transition:transform .3s cubic-bezier(.3,1.5,.5,1)}
.sw i.on{background:var(--fill)}.sw i.on:after{transform:translateX(20px)}
.btn{display:block;width:100%;border:0;border-radius:20px;padding:15px;font:600 16px inherit;font-family:inherit;background:linear-gradient(180deg,#5fe3c2,#2eb896);color:var(--dk);cursor:pointer;margin-top:12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 10px 26px rgba(46,184,150,.35);transition:transform .15s}
.btn.g{color:var(--tx);box-shadow:var(--gs)}.btn.r{background:linear-gradient(180deg,#ef8a84,#d2554e);color:#fff}.btn.dis{opacity:.4;pointer-events:none}
.btn:active,.pk:active,.pl:active{transform:scale(.96)}
.row{display:flex;gap:10px}.row>*{flex:1}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid .pk:last-child:nth-child(odd){grid-column:span 2}
.pk{display:flex;align-items:center;gap:10px;border-radius:20px;padding:13px 14px;color:var(--tx);font:inherit;text-align:left;cursor:pointer;transition:transform .15s}
.pk b{display:block;font-size:16px;line-height:1.15}.pk span{color:var(--ac);font-size:13px;font-weight:600}.pk.dis{opacity:.4;pointer-events:none}.pk .ci,.pk .pb{font-size:26px}
input,textarea{width:100%;border-radius:16px;padding:14px;color:var(--tx);font:inherit;margin-top:8px;outline:0;box-shadow:inset 0 1px 3px rgba(0,0,0,.35);transition:border-color .2s}
input:focus,textarea:focus{border-color:rgba(79,214,180,.6)}textarea{min-height:120px;resize:none}
.seg{display:flex;border-radius:20px;padding:4px;margin-bottom:12px}
.seg div{flex:1;text-align:center;padding:10px 6px;border-radius:16px;color:var(--t2);cursor:pointer;font-weight:500;font-size:14px;transition:background .25s,color .25s}
.seg .on{color:var(--tx);background:rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 4px 12px rgba(0,0,0,.25)}
.code{font-size:46px;font-weight:800;letter-spacing:10px;text-align:center;color:var(--ac);margin:6px 0;font-variant-numeric:tabular-nums;cursor:pointer;text-shadow:0 0 28px rgba(79,214,180,.5);animation:pop .5s var(--ease)}
.stat{text-align:center}.stat b{display:block;font-size:26px}.mid{display:grid;place-items:center;text-align:center;padding:60px 24px;color:var(--t2);gap:10px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;padding:0 16px calc(12px + env(safe-area-inset-bottom))}
.nb{position:relative;display:flex;width:100%;max-width:420px;border-radius:30px;padding:6px}
.ind{position:absolute;left:6px;top:6px;bottom:6px;border-radius:24px;background:rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 4px 14px rgba(0,0,0,.25);transition:transform .45s cubic-bezier(.3,1.25,.5,1)}
.nb button{position:relative;flex:1;border:0;background:none;color:var(--t3);padding:9px 2px;border-radius:24px;font:11px inherit;font-family:inherit;font-weight:600;cursor:pointer;transition:color .3s,transform .15s}
.nb button:active{transform:scale(.92)}.nb button.on{color:var(--ac)}
.nb svg{display:block;margin:0 auto 3px;width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#toast{position:fixed;left:50%;top:calc(var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px) + 8px);transform:translate(-50%,-120px);padding:12px 20px;border-radius:22px;transition:transform .5s cubic-bezier(.2,1.4,.4,1);z-index:9;max-width:88%;text-align:center;font-weight:500}
#toast.s{transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*,:before,:after{animation:none!important;transition:none!important}}
</style></head><body>

<script>
const tg=Telegram.WebApp;tg.ready();tg.expand();
try{if(['ios','android'].includes(tg.platform)){tg.isVersionAtLeast('8.0')&&tg.requestFullscreen();tg.isVersionAtLeast('7.7')&&tg.disableVerticalSwipes()}tg.setHeaderColor('#0d1512');tg.setBackgroundColor('#0d1512')}catch(e){}
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S=null,AD=null,V='home',shop='',adm='pr',mode='r',ed=null,tick=null,poll=null,busy=false,navKey='';
const ps=v=>v==null?'—':v+' ⭐',CI='<i class="ci"></i>',PB='<i class="pb">⭐</i>';
const SEC={get_number:'Получить номер',profile:'Профиль',shop:'Магазин',support:'Поддержка',shop_number:'Номер',shop_username:'NFT-юз',shop_coins:'Cat Coin',shop_premium:'Premium'};
async function api(n,b){try{const r=await fetch('/api/'+n,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...b,init:tg.initData})});return await r.json()}catch(e){return{error:'Нет связи с сервером'}}}
function toast(m){const t=$('#toast');t.textContent=m;t.className='s';clearTimeout(t._t);t._t=setTimeout(()=>t.className='',2600)}
async function load(first){const j=await api('state');if(j.error)return toast(j.error);S=j;render(first)}
async function act(n,b){if(busy)return;busy=true;const j=await api(n,b);busy=false;if(j.error){toast(j.error);return null}if(j.blocked||(j.ok&&'profile' in j)){S=j;render()}return j}
async function ad(op,x){if(busy)return;busy=true;const j=await api('admin',{op,...x});busy=false;if(j.error){toast(j.error);return null}if(j.blocked){S=j;render(true);return null}AD=j.admin;S.prices=j.prices;S.hidden=j.hidden;ed=null;render();return j}
const hid=k=>S.hidden[k],show=k=>!hid(k)||S.is_admin,lock=k=>hid(k)?'🔒 ':'';
const left=u=>{if(!u)return null;const d=new Date(u)-Date.now();return d<=0?null:Math.floor(d/864e5)+' д '+Math.floor(d%864e5/36e5)+' ч'};
const ICO={home:'<path d="M4 11l8-7 8 7v9H4z"/>',shop:'<path d="M5 8h14l-1 12H6zM9 8a3 3 0 016 0"/>',support:'<path d="M4 5h16v11H9l-5 4z"/>',admin:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/>'};
const NAME={home:'Главная',shop:'Магазин',support:'Поддержка',admin:'Админ'};
function tabs(){return['home',...(show('shop')?['shop']:[]),...(show('support')?['support']:[]),...(S.is_admin?['admin']:[])]}
function drawNav(){const t=tabs(),k=t.join(),nv=$('#nv');if(k!==navKey){navKey=k;nv.innerHTML=`<div class="nb"><i class="ind" style="width:calc((100% - 12px)/${t.length})"></i>${t.map(x=>`<button data-a="go" data-v="${x}"><svg viewBox="0 0 24 24">${ICO[x]}</svg>${NAME[x]}</button>`).join('')}</div>`}
 const i=Math.max(0,t.indexOf(V));nv.querySelector('.ind').style.transform=`translateX(${i*100}%)`;nv.querySelectorAll('button').forEach((b,j)=>b.classList.toggle('on',j===i))}
const pills=(l,cur,a)=>`<div class="pills">${l.map(([k,t])=>`<button class="pl ${k===cur?'on':''}" data-a="${a}" data-k="${k}">${t}</button>`).join('')}</div>`;
function render(fresh){
 clearInterval(tick);clearInterval(poll);const m=$('#m');
 if(!S){m.innerHTML='<div class="mid">Загрузка…</div>';return}
 if(S.blocked){const sub=S.blocked==='sub';navKey='';$('#nv').innerHTML='';m.innerHTML=`<div class="mid"><div style="font-size:44px">${sub?'📢':S.blocked==='banned'?'🚫':'🛠'}</div><h1>${sub?'Подпишитесь на канал':S.blocked==='banned'?'Доступ закрыт':'Технические работы'}</h1><div>${esc(S.text||'Чтобы пользоваться Orenix, подпишитесь на наш канал.')}</div>${sub?`<button class="btn" data-a="link" data-u="${esc(S.link)}">Подписаться</button><button class="btn g" data-a="reload">Я подписался</button>`:''}</div>`;return}
 drawNav();const p=S.profile;
 m.classList.remove('in');m.innerHTML={home,shop:shopV,support,admin:adminV}[V]();
 if(fresh){void m.offsetWidth;m.classList.add('in')}
 if(V==='home'&&!p){poll=setInterval(async()=>{const j=await api('state');if(j.ok&&(JSON.stringify(j.reg)!==JSON.stringify(S.reg)||j.profile)){S=j;render(true)}},3000);
  if(S.reg&&S.reg.code&&S.reg.left>0)tick=setInterval(()=>{S.reg.left--;const e=$('#t');if(e)e.textContent=Math.floor(S.reg.left/60)+':'+String(S.reg.left%60).padStart(2,'0');if(S.reg.left<=0)load()},1000)}
}
const items=l=>l.length?l.map(x=>`<div class="item" data-a="copy" data-c="${esc(x)}"><span>${esc(x)}</span><i>копировать</i></div>`).join(''):'<div class="sub">—</div>';
function home(){const p=S.profile;
 if(p){const pr=left(p.premium_until);return`<div class="hero"><div class="av"${p.avatar?` style="background-image:url('${esc(p.avatar).replace(/'/g,'%27')}')"`:''}>${p.avatar?'':esc((p.name||'O')[0].toUpperCase())}</div><div><h1>${esc(p.name)}</h1><div class="sub">${p.is_premium?PB+' Premium · '+(pr?'осталось '+pr:'бессрочно'):'Premium не активен'}</div></div></div>
 <div class="card main-num"><h3>Номера</h3>${items(p.phones)}</div><div class="card"><h3>Юзернеймы</h3>${items(p.names)}</div>
 <div class="card"><h3>Cat Coin</h3><div class="big">${CI} ${p.balance}</div></div>${show('shop')?'<button class="btn" data-a="go" data-v="shop">Открыть магазин</button>':''}`}
 if(!show('get_number'))return'<div class="mid"><div style="font-size:44px">🔒</div><div>Раздел временно недоступен</div></div>';
 const r=S.reg;
 if(!r)return`<h2>${lock('get_number')}Получите номер Orenix</h2><div class="card"><div class="sub">Выберите регион — мы сгенерируем номер для регистрации в мессенджере.</div></div><div class="row"><button class="btn" data-a="reg" data-r="7">🇷🇺 +7</button><button class="btn" data-a="reg" data-r="1">🇺🇸 +1</button></div>`;
 return`<h2>Ваш номер</h2><div class="card main-num" data-a="copy" data-c="${r.body}"><div class="sub">${esc(r.region)}</div><div class="big">${esc(r.body)}</div><div class="sub" style="margin-top:6px">нажмите, чтобы скопировать</div></div>
 <div class="card sub">1. Откройте Orenix Messenger → «Регистрация»<br>2. Введите регион и номер, нажмите «Далее»<br>3. Вернитесь сюда и получите код</div>
 ${r.code&&r.left>0?`<div class="card"><h3>Код подтверждения</h3><div class="code" data-a="copy" data-c="${r.code}">${r.code}</div><div class="sub" style="text-align:center">действует <b id="t">${Math.floor(r.left/60)}:${String(r.left%60).padStart(2,'0')}</b></div></div>`:
 `<button class="btn ${r.entered?'':'dis'}" data-a="code">${r.entered?(r.expired?'Получить новый код':'Получить код'):'🔒 Получить код'}</button>${r.entered?'':'<div class="sub" style="text-align:center;margin-top:8px">Кнопка включится, когда вы введёте номер на сайте</div>'}`}
 ${S.messenger_url?`<button class="btn g" data-a="link" data-u="${esc(S.messenger_url)}">Открыть мессенджер</button>`:''}`}
const ST=[['num','shop_number','Номер'],['usr','shop_username','NFT-юз'],['coin','shop_coins','Cat Coin'],['prem','shop_premium','Premium']];
function shopV(){
 if(!S.profile)return'<div class="mid"><div>Сначала получите номер и зарегистрируйтесь</div><button class="btn" data-a="go" data-v="home">Получить номер</button></div>';
 const v=ST.filter(x=>show(x[1]));if(!v.length)return'<div class="mid">Нет доступных разделов</div>';
 if(!v.find(x=>x[0]===shop))shop=v[0][0];
 return pills(v.map(x=>[x[0],lock(x[1])+x[2]]),shop,'st')+{num,usr,coin,prem}[shop]()}
function num(){const P=S.prices,k=mode==='r'?'num_rand':'num_custom';return`<div class="seg"><div class="${mode==='r'?'on':''}" data-a="mode" data-m="r">🎲 Рандом · ${ps(P.num_rand)}</div><div class="${mode==='c'?'on':''}" data-a="mode" data-m="c">✍️ Свой · ${ps(P.num_custom)}</div></div>
 <div class="card"><div class="sub">Код региона</div><input id="rc" inputmode="numeric" maxlength="3" placeholder="например 7" value="7">${mode==='c'?'<div class="sub" style="margin-top:10px">4 цифры номера</div><input id="dg" inputmode="numeric" maxlength="4" placeholder="1234">':''}</div>
 <button class="btn ${P[k]==null?'dis':''}" data-a="pay" data-k="${mode==='r'?'numr':'numc'}">Оплатить ${ps(P[k])}</button><div class="sub" style="text-align:center;margin-top:8px">Номер сразу придёт на ваш аккаунт</div>`}
function usr(){const P=S.prices.username;return`<div class="card"><div class="sub">4–10 символов: латиница, цифры, _</div><input id="un" maxlength="10" placeholder="@username" autocapitalize="off"></div><button class="btn ${P==null?'dis':''}" data-a="pay" data-k="usr">Оплатить ${ps(P)}</button>`}
function coin(){return`<div class="sub" style="margin:0 4px 10px">Курс: 1 ⭐ = 100 кк</div><div class="grid">${S.prices.coins.map((c,i)=>`<button class="pk ${c.stars==null?'dis':''}" data-a="pay" data-k="coin" data-i="${i}">${CI}<div><b>${c.coins} кк</b><span>${ps(c.stars)}</span></div></button>`).join('')}</div>`}
function prem(){return`<div class="grid">${Object.entries(S.prices.premium).sort((a,b)=>a[0]-b[0]).map(([d,v])=>`<button class="pk ${v==null?'dis':''}" data-a="pay" data-k="prem" data-d="${d}">${PB}<div><b>${d} дн.</b><span>${ps(v)}</span></div></button>`).join('')}</div>`}
function support(){return`<h2>Поддержка</h2><div class="card"><div class="sub">Опишите проблему — ответ придёт в чат с ботом.</div><textarea id="sp" maxlength="2000" placeholder="Ваше сообщение…"></textarea></div><button class="btn" data-a="send">Отправить</button>`}
const AT=[['pr','Цены'],['vs','Видимость'],['mt','Работы'],['bn','Баны'],['am','Админы'],['lk','Привязки'],['bc','Рассылка'],['ss','Статистика']];
function adminV(){if(!AD)return'<div class="mid">Загрузка…</div>';return pills(AT,adm,'at')+({pr:apr,vs:avs,mt:amt,bn:abn,am:aam,lk:alk,bc:abc,ss:ass}[adm])()}
function apr(){const P=S.prices,r=[['num_rand','Номер · рандом',P.num_rand],['num_custom','Номер · свой',P.num_custom],['username','NFT-юз',P.username],...Object.entries(P.premium).sort((a,b)=>a[0]-b[0]).map(([d,v])=>['prem:'+d,'Premium · '+d+' дн.',v]),...P.coins.map((c,i)=>['coin:'+i,c.coins+' кк',c.stars])];
 return'<div class="card">'+r.map(([k,l,v])=>`<div class="pr" data-a="pe" data-k="${k}"><span>${l}</span><b>${ps(v)}</b></div>${ed===k?`<div class="ped"><input id="pv" inputmode="numeric" placeholder="цена в ⭐" value="${v??''}"><div class="row"><button class="btn" data-a="psave" data-k="${k}">Сохранить</button><button class="btn g" data-a="psave" data-k="${k}" data-n="1">Прочерк —</button></div></div>`:''}`).join('')+'</div>'}
const sw=(k,l,on,a)=>`<div class="sw" data-a="${a}" data-k="${k}"><span>${l}</span><i class="${on?'on':''}"></i></div>`;
function avs(){return'<div class="sub" style="margin:0 4px 10px">Выключенные разделы скрыты от пользователей, админы видят их с 🔒.</div><div class="card">'+Object.entries(SEC).map(([k,l])=>sw(k,l,!hid(k),'hide')).join('')+'</div>'}
function amt(){const m=AD.maintenance;return`<div class="card">${sw('mt','Технические работы',m.on,'mtt')}</div><div class="card"><h3>Текст для пользователей</h3><textarea id="mx">${esc(m.text)}</textarea><button class="btn" data-a="mtsave">Сохранить текст</button></div><div class="card"><h3>Ссылка на мессенджер</h3><input id="mu" value="${esc(AD.messenger_url)}" placeholder="https://…"><button class="btn g" data-a="musave">Сохранить ссылку</button></div>`}
const lst=a=>a.length?a.join(''):'<div class="sub">Список пуст</div>';
function abn(){return`<div class="card"><h3>Telegram ID или @username</h3><input id="bq" placeholder="123456789"><div class="row"><button class="btn r" data-a="ban" data-b="ban">Забанить</button><button class="btn g" data-a="ban" data-b="unban">Разбанить</button></div></div><div class="card"><h3>В бане</h3>${lst(AD.banned.map(x=>`<div class="item" data-a="copy" data-c="${x.tg_id}"><span>${x.tg_id} ${esc(x.username?'@'+x.username:'')}</span><i>копировать</i></div>`))}</div>`}
function aam(){return`<div class="card"><h3>Telegram ID или @username</h3><input id="aq" placeholder="123456789"><div class="row"><button class="btn" data-a="amadd">Добавить</button><button class="btn g" data-a="amdel">Удалить</button></div></div><div class="card"><h3>Админы</h3>${lst([...AD.admins.main.map(x=>`<div class="item"><span>${x}</span><i>главный</i></div>`),...AD.admins.extra.map(x=>`<div class="item"><span>${x}</span><i>админ</i></div>`)])}</div>`}
function alk(){return`<div class="card"><h3>Привязать аккаунт сайта к Telegram</h3><input id="li" inputmode="numeric" placeholder="Telegram ID"><input id="lq" placeholder="+7 912 345 678 9 или @username"><button class="btn" data-a="lkadd">Привязать</button></div><div class="card"><h3>Привязки</h3>${lst(AD.links.map(x=>`<div class="item" data-a="lkdel" data-k="${x.tg}"><span>${x.tg} → ${esc(x.label)}</span><i>убрать</i></div>`))}</div>`}
function abc(){return`<div class="card"><h3>Сообщение всем пользователям бота</h3><textarea id="bt" placeholder="Текст рассылки…"></textarea><button class="btn" data-a="bc">Отправить всем</button></div>`}
function ass(){const s=AD.stats;return`<div class="grid">${[['Пользователей',s.users],['В бане',s.banned],['Заказов',s.orders],['Звёзд ⭐',s.stars],['Обращений',s.tickets]].map(([l,v])=>`<div class="card stat"><b>${v}</b><span class="sub">${l}</span></div>`).join('')}</div>`}
const val=id=>($(id)||{}).value||'';
const A={
 go(e){V=e.dataset.v;if(V==='admin'&&!AD)ad('get',{});render(true);scrollTo(0,0)},reload(){load()},st(e){shop=e.dataset.k;render(true)},at(e){adm=e.dataset.k;ed=null;render(true)},
 link(e){const u=e.dataset.u;u.includes('t.me')?tg.openTelegramLink(u):tg.openLink(u)},
 copy(e){navigator.clipboard&&navigator.clipboard.writeText(e.dataset.c);try{tg.HapticFeedback.notificationOccurred('success')}catch(x){}toast('Скопировано')},
 mode(e){mode=e.dataset.m;render()},
 async reg(e){await act('reg_start',{region:e.dataset.r})},async code(){await act('reg_code',{})},
 async send(){const t=val('#sp').trim();if(t.length<3)return toast('Напишите сообщение');if(await act('support',{text:t})){$('#sp').value='';toast('Обращение отправлено ✅')}},
 async pay(e){const d=e.dataset,b={kind:d.k};if(d.k==='numr'||d.k==='numc'){b.code=val('#rc').trim();if(d.k==='numc')b.digits=val('#dg').trim()}
  if(d.k==='usr')b.name=val('#un').trim().replace(/^@/,'');if(d.k==='coin')b.idx=+d.i;if(d.k==='prem')b.days=d.d;
  const j=await act('pay',b);if(j&&j.link)tg.openInvoice(j.link,s=>{if(s==='paid'){toast('Оплачено ✅');setTimeout(load,1500)}else if(s==='failed')toast('Оплата не прошла')})},
 pe(e){ed=ed===e.dataset.k?null:e.dataset.k;render()},
 async psave(e){const v=e.dataset.n?null:val('#pv').trim();if(v!==null&&!/^\d+$/.test(v))return toast('Введите число');if(await ad('price',{key:e.dataset.k,value:v}))toast('Сохранено')},
 async hide(e){await ad('hide',{key:e.dataset.k})},async mtt(){await ad('mt',{on:!AD.maintenance.on})},
 async mtsave(){if(await ad('mt',{text:val('#mx')}))toast('Сохранено')},async musave(){if(await ad('url',{url:val('#mu').trim()}))toast('Сохранено')},
 async ban(e){if(await ad(e.dataset.b,{q:val('#bq')}))toast('Готово')},
 async amadd(){if(await ad('adm_add',{q:val('#aq')}))toast('Админ добавлен')},async amdel(){if(await ad('adm_del',{q:val('#aq')}))toast('Админ удалён')},
 async lkadd(){if(await ad('lk_add',{id:val('#li').trim(),q:val('#lq').trim()}))toast('Привязано')},async lkdel(e){if(await ad('lk_del',{id:e.dataset.k}))toast('Убрано')},
 async bc(){const t=val('#bt').trim();if(t.length<2)return toast('Введите текст');const go=async()=>{if(await ad('bc',{text:t}))toast('Рассылка запущена')};tg.showConfirm?tg.showConfirm('Отправить всем пользователям?',ok=>ok&&go()):go()}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(el&&A[el.dataset.a])A[el.dataset.a](el)});
load(true);
</script></body></html>
