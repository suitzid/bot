--g:linear-gradient(180deg,rgba(255,255,255,.13),rgba(255,255,255,.055));--gs:inset 0 1px 0 rgba(255,255,255,.24),inset 0 -1px 0 rgba(255,255,255,.04),0 10px 30px rgba(0,0,0,.28);--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
body{-webkit-user-select:none;user-select:none;overflow-x:hidden}input,textarea{-webkit-user-select:text;user-select:text}
nav{transition:transform .3s var(--ease)}body.kb nav{transform:translateY(130%)}
html,body{min-height:100%;background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,"SF Pro Display","SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.fx{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:radial-gradient(120% 70% at 50% 0%,#11201b 0%,#0d1512 60%,#0a100e 100%)}
.fx i{position:absolute;width:95vw;height:95vw;max-width:520px;max-height:520px;border-radius:50%;will-change:transform}
.fx i:nth-child(1){left:-25vw;top:-8vh;background:radial-gradient(circle,rgba(46,184,150,.6),transparent 68%);animation:b1 13s ease-in-out infinite alternate}
.fx i:nth-child(2){right:-30vw;top:34vh;background:radial-gradient(circle,rgba(74,124,240,.5),transparent 68%);animation:b2 16s ease-in-out infinite alternate}
.fx i:nth-child(3){left:-10vw;bottom:-18vh;background:radial-gradient(circle,rgba(60,210,180,.4),transparent 68%);animation:b3 19s ease-in-out infinite alternate}
@keyframes b1{to{transform:translate3d(55vw,38vh,0) scale(1.15)}}@keyframes b2{to{transform:translate3d(-60vw,-30vh,0) scale(.9)}}@keyframes b3{to{transform:translate3d(50vw,-44vh,0) scale(1.2)}}
#app{position:relative;z-index:1;max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.top{height:calc(var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px) + 10px)}
.lg{display:none;position:fixed;left:50%;top:13px;transform:translateX(-50%);height:27px;width:auto;z-index:30;pointer-events:none;filter:drop-shadow(0 3px 10px rgba(0,200,60,.35))}
.ver{display:none;position:fixed;left:50%;top:50px;transform:translateX(-50%);z-index:30;font-size:10px;letter-spacing:.6px;color:rgba(255,255,255,.2);pointer-events:none}
body.fs .lg,body.fs .ver{display:block}
#sb{position:fixed;right:3px;top:calc(var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px) + 14px);bottom:108px;width:4px;z-index:6;pointer-events:none;opacity:0;transition:opacity .35s}
#sb.on{opacity:1}#sb i{position:absolute;left:0;right:0;border-radius:4px;background:rgba(255,255,255,.4);box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.chip,.card,.pk,.seg,input,textarea,.btn.g,#toast,.nb,.hc,.go{background:var(--g);border:1px solid var(--line);box-shadow:var(--gs)}
.nb,#toast{-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
main{flex:1;padding:6px 16px 118px;overflow-x:hidden;overflow-x:clip}
.in>*{animation:rise .55s var(--ease) both}.in>:nth-child(2){animation-delay:.06s}.in>:nth-child(3){animation-delay:.12s}.in>:nth-child(4){animation-delay:.18s}.in>:nth-child(5){animation-delay:.24s}.in>:nth-child(n+6){animation-delay:.3s}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.05)}100%{transform:scale(1)}}
@keyframes swap{from{opacity:0;transform:translateX(calc(var(--d,1)*30px))}to{opacity:1;transform:none}}
.in>.swp,.swp{animation:swap .42s var(--ease) 0s both}
h1{font-size:23px;font-weight:700;letter-spacing:-.4px;margin:0 0 2px}h2{font-size:19px;font-weight:700;letter-spacing:-.3px;margin:8px 4px 12px}h3{font-size:13px;color:var(--t2);font-weight:600;margin-bottom:6px}
.sub{color:var(--t2);font-size:13px}.card{border-radius:26px;padding:14px 16px;margin-bottom:10px}
.pills{position:relative;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 12px;padding:2px 16px 6px}.pills::-webkit-scrollbar{display:none}
.pills>.pl:first-of-type{margin-left:auto}.pills>.pl:last-child{margin-right:auto}
.pi{position:absolute;left:0;top:2px;bottom:6px;width:0;border-radius:99px;background:linear-gradient(180deg,#5fe3c2,#2eb896);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 6px 18px rgba(46,184,150,.35);transition:transform .45s cubic-bezier(.3,1.2,.5,1),width .45s cubic-bezier(.3,1.2,.5,1)}
.pl{position:relative;flex:none;border-radius:99px;padding:9px 16px;color:var(--t2);background:rgba(255,255,255,.07);border:1px solid var(--line);font:600 14px inherit;font-family:inherit;cursor:pointer;transition:color .3s,transform .15s}
.pl.on{color:var(--dk);background:transparent;border-color:transparent}
.hc{display:flex;align-items:center;gap:14px;border-radius:32px;padding:16px 12px 16px 16px;margin:2px 0 12px;background:linear-gradient(135deg,rgba(79,214,180,.24),rgba(74,124,240,.13));border-color:rgba(255,255,255,.22)}
.hm{flex:1;min-width:0}.hm h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;font-size:13px;color:var(--t2)}
.meta span{display:inline-flex;align-items:center;gap:6px}.bal{color:var(--tx);font-weight:700;font-size:15px}
.go{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--tx);cursor:pointer;transition:transform .15s}.go:active{transform:scale(.88)}
.go svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.av{width:58px;height:58px;border-radius:50%;flex:none;background:linear-gradient(135deg,var(--fill),var(--blue)) center/cover;display:grid;place-items:center;font-size:24px;font-weight:700;color:#fff;border:2px solid rgba(255,255,255,.3);box-shadow:0 8px 24px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.4)}
.ci{display:inline-block;width:1.15em;height:1.15em;background:var(--coin) center/contain no-repeat;vertical-align:-.2em;flex:none}
.pb{display:inline-grid;place-items:center;width:1.5em;height:1.5em;border-radius:.5em;background:linear-gradient(135deg,var(--c1,#e0b04a),var(--c2,#e2716a));font-size:.8em;flex:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.main-num{background:linear-gradient(180deg,rgba(79,214,180,.2),rgba(79,214,180,.06));border-color:rgba(79,214,180,.4)}
.big{font-size:27px;font-weight:700;letter-spacing:.3px;font-variant-numeric:tabular-nums;word-break:break-all}
.item,.pr,.sw{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid rgba(255,255,255,.08);cursor:pointer;font-variant-numeric:tabular-nums;transition:opacity .15s}
.pr,.sw{padding:12px 0}.item:first-of-type,.pr:first-child,.sw:first-child{border-top:0}.item i{font-style:normal;color:var(--t3);font-size:12px}.pr b{color:var(--ac)}.item:active,.pr:active{opacity:.55}
.pr s,.pk s{color:var(--t3);font-weight:500;margin-right:4px;font-size:.85em}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chp{padding:7px 13px;border-radius:99px;background:rgba(255,255,255,.08);border:1px solid var(--line);font-size:14px;cursor:pointer;transition:transform .15s}.chp:active{transform:scale(.94)}
.more{display:block;width:100%;margin-top:8px;padding:9px;border:0;border-radius:14px;background:rgba(255,255,255,.07);color:var(--ac);font:600 13px inherit;font-family:inherit;cursor:pointer;transition:transform .15s}.more:active{transform:scale(.97)}
.ped{padding:0 0 12px;animation:rise .3s var(--ease)}.ped .btn{margin-top:8px}
.sw i{width:50px;height:30px;border-radius:99px;background:rgba(255,255,255,.14);position:relative;transition:background .25s;flex:none}
.sw i{transition:background .3s,box-shadow .3s}.sw i.on{background:var(--fill);box-shadow:0 0 16px rgba(46,184,150,.55)}
.sw i:after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:15px;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.35);transition:transform .42s cubic-bezier(.3,1.6,.5,1),width .2s}
.sw i.on:after{transform:translateX(20px)}.sw:active i:after{width:31px}.sw:active i.on:after{transform:translateX(13px)}
.btn{position:relative;display:block;width:100%;border:0;border-radius:20px;padding:15px;font:600 16px inherit;font-family:inherit;background:linear-gradient(180deg,#5fe3c2,#2eb896);color:var(--dk);cursor:pointer;margin-top:12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 10px 26px rgba(46,184,150,.35);transition:transform .15s}
.btn.g{color:var(--tx);box-shadow:var(--gs)}.btn.r{background:linear-gradient(180deg,#ef8a84,#d2554e);color:#fff}.btn.dis{opacity:.4;pointer-events:none}
.btn:active,.pk:active,.pl:active{transform:scale(.96)}.row{display:flex;gap:10px}.row>*{flex:1}
.dc{position:absolute;top:8px;right:8px;font:700 11px/1 inherit;font-style:normal;font-family:inherit;background:linear-gradient(135deg,#ff9a5c,#e2716a);color:#fff;border-radius:99px;padding:4px 7px;box-shadow:0 4px 10px rgba(226,113,106,.45)}.btn .dc{top:-8px;right:14px}
.grid{display:grid;gap:10px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
.pk{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;aspect-ratio:1;border-radius:24px;padding:10px 6px;color:var(--tx);font:inherit;text-align:center;cursor:pointer;transition:transform .15s}
.pk b{font-size:17px;line-height:1.1}.pk span{color:var(--ac);font-size:13px;font-weight:600}.pk.dis{opacity:.4;pointer-events:none}
.pk .ci{font-size:34px}.pk .pb{font-size:30px}.g3 .pk b{font-size:15px}.g3 .pk .ci{font-size:30px}
.g2 .pk:last-child:nth-child(odd){grid-column:span 2;aspect-ratio:auto;padding:16px;flex-direction:row;gap:12px}
.info .ih{display:flex;gap:12px;align-items:center;margin-bottom:8px}.info b{font-size:16px}
.ib{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;font-size:22px;flex:none;background:linear-gradient(135deg,rgba(79,214,180,.35),rgba(74,124,240,.3));box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.info ul{list-style:none;display:grid;gap:6px;padding-top:4px}.info li{font-size:13.5px;color:#cfd8d2;padding-left:22px;position:relative}.info li:before{content:"✓";position:absolute;left:0;color:var(--ac);font-weight:700}
.fq{border-top:1px solid rgba(255,255,255,.08);cursor:pointer}.fq:first-child{border-top:0}.fq .q{display:flex;justify-content:space-between;gap:10px;padding:12px 0;font-weight:600;font-size:14px}.fq .q i{font-style:normal;color:var(--ac);transition:transform .3s}
.fq .a{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s var(--ease)}.fq .a>div{overflow:hidden;color:var(--t2);font-size:13.5px}.fq.o .a{grid-template-rows:1fr}.fq.o .a>div{padding-bottom:12px}.fq.o .q i{transform:rotate(45deg)}
input,textarea{width:100%;border-radius:16px;padding:14px;color:var(--tx);font:inherit;margin-top:8px;outline:0;box-shadow:inset 0 1px 3px rgba(0,0,0,.35);transition:border-color .2s}
input:focus,textarea:focus{border-color:rgba(79,214,180,.6)}textarea{min-height:120px;resize:none}

.code{font-size:46px;font-weight:800;letter-spacing:10px;text-align:center;color:var(--ac);margin:6px 0;font-variant-numeric:tabular-nums;cursor:pointer;text-shadow:0 0 28px rgba(79,214,180,.5);animation:pop .5s var(--ease)}

nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;padding:0 16px calc(12px + env(safe-area-inset-bottom))}
.nb{position:relative;display:flex;width:100%;max-width:420px;border-radius:30px;padding:6px}
.ind{position:absolute;left:6px;top:6px;bottom:6px;border-radius:24px;background:rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 4px 14px rgba(0,0,0,.25);transition:transform .45s cubic-bezier(.3,1.25,.5,1)}
.nb button{position:relative;flex:1;border:0;background:none;color:var(--t3);padding:9px 2px;border-radius:24px;font:11px inherit;font-family:inherit;font-weight:600;cursor:pointer;transition:color .3s,transform .15s}
.nb button:active{transform:scale(.92)}.nb button.on{color:var(--ac)}.nb svg{display:block;margin:0 auto 3px;width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#toast{position:fixed;left:50%;top:calc(var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px) + 8px);opacity:0;visibility:hidden;pointer-events:none;transform:translate(-50%,-24px) scale(.94);transition:transform .45s cubic-bezier(.2,1.4,.4,1),opacity .25s,visibility .25s;padding:12px 20px;border-radius:22px;z-index:9;max-width:88%;text-align:center;font-weight:500}
#toast.s{opacity:1;visibility:visible;transform:translate(-50%,0) scale(1)}
.ad{position:relative;display:flex;align-items:center;gap:10px;border-radius:24px;padding:11px 12px 12px 16px;margin:0 0 12px;background:var(--g);border:1px solid var(--line);box-shadow:var(--gs);cursor:pointer;overflow:hidden;max-height:240px;transition:max-height .45s var(--ease),opacity .3s,margin .45s,padding .45s,transform .35s}
.ad.out{max-height:0;opacity:0;margin:0;padding-top:0;padding-bottom:0;transform:translateY(-12px);border-width:0}
.adb{flex:1;min-width:0}.adh{display:flex;flex-wrap:nowrap;align-items:center;gap:4px 10px;margin-bottom:3px;min-width:0}.adl{flex:none;color:#a78bfa;font-weight:700;font-size:15px}.adh b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.adw{flex:none;border:0;border-radius:99px;padding:3px 11px;background:rgba(167,139,250,.2);color:#b9a4ff;font:500 13px inherit;font-family:inherit;cursor:pointer}
.adt{font-size:15px;line-height:1.35;color:#eef1ec;word-break:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.adx{flex:none;width:32px;height:32px;border:0;border-radius:50%;background:none;color:var(--t2);font-size:20px;cursor:pointer;display:grid;place-items:center}
@media(prefers-reduced-motion:reduce){*,:before,:after{animation:none!important;transition:none!important}}

try{if(['ios','android'].includes(tg.platform)){tg.isVersionAtLeast('8.0')&&tg.requestFullscreen();tg.isVersionAtLeast('7.7')&&tg.disableVerticalSwipes()}tg.setHeaderColor('#0d1512');tg.setBackgroundColor('#0d1512')}catch(e){}
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hap=t=>{try{const H=tg.HapticFeedback;t==='s'?H.selectionChanged():['success','error','warning'].includes(t)?H.notificationOccurred(t):H.impactOccurred(t||'light')}catch(e){}};
const fsf=()=>document.body.classList.toggle('fs',!!tg.isFullscreen||!!(tg.contentSafeAreaInset&&tg.contentSafeAreaInset.top>0));fsf();
try{['fullscreenChanged','fullscreenFailed','contentSafeAreaChanged','safeAreaChanged'].forEach(e=>tg.onEvent(e,fsf))}catch(e){}
let S=null,AD=null,V='home',shop='',adm='pr',mode='r',ed=null,tick=null,poll=null,busy=false,navKey='',SH={ph:0,nm:0},FQ=-1;
const ci='<i class="ci"></i>',PBC=['#36c2a3,#2a8f86','#5b8def,#3b5fc8','#a06cf0,#6e45c9','#ec6b9a,#c94579','#e0b04a,#e2716a'];
const pb=i=>{const c=(PBC[i]||PBC[4]).split(',');return`<i class="pb" style="--c1:${c[0]};--c2:${c[1]}">⭐</i>`},PB='<i class="pb">⭐</i>';
const old=k=>(S.old||{})[k],dsc=(k,v)=>{const o=old(k);return o&&v!=null&&o>v?Math.round((o-v)/o*100):0};
const pr2=(k,v)=>v==null?'—':(dsc(k,v)?`<s>${old(k)}</s>${v} ⭐`:v+' ⭐'),bdg=(k,v)=>dsc(k,v)?`<em class="dc">-${dsc(k,v)}%</em>`:'';
const SEC={get_number:'Получить номер',profile:'Профиль',shop:'Магазин',support:'Поддержка',shop_number:'Номер',shop_username:'NFT-юз',shop_coins:'Cat Coin',shop_premium:'Premium'};
async function api(n,b){try{const r=await fetch('/api/'+n,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...b,init:tg.initData})});return await r.json()}catch(e){return{error:'Нет связи с сервером'}}}
function toast(m,k){const t=$('#toast');t.textContent=m;t.className='s';clearTimeout(t._t);t._t=setTimeout(()=>t.className='',2400);if(k===1)hap('success');else if(k===0)hap('error')}
async function load(first){const j=await api('state');if(j.error)return toast(j.error,0);S=j;render(first)}
async function act(n,b){if(busy)return;busy=true;const j=await api(n,b);busy=false;if(j.error){toast(j.error,0);return null}if(j.blocked||(j.ok&&'profile' in j)){S=j;render()}return j}
async function ad(op,x,soft){if(busy)return;busy=true;const j=await api('admin',{op,...x});busy=false;if(j.error){toast(j.error,0);return null}if(j.blocked){S=j;render(true);return null}AD=j.admin;S.prices=j.prices;S.hidden=j.hidden;S.old=j.old;ed=null;soft?drawNav():refresh();return j}
const hid=k=>S.hidden[k],show=k=>!hid(k)||S.is_admin,lock=k=>hid(k)?'🔒 ':'';
const left=u=>{if(!u)return null;const d=new Date(u)-Date.now();return d<=0?null:Math.floor(d/864e5)+' д '+Math.floor(d%864e5/36e5)+' ч'};
const ICO={home:'<path d="M4 11l8-7 8 7v9H4z"/>',shop:'<path d="M5 8h14l-1 12H6zM9 8a3 3 0 016 0"/>',support:'<path d="M4 5h16v11H9l-5 4z"/>',admin:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/>'};
const NAME={home:'Главная',shop:'Магазин',support:'Поддержка',admin:'Админ'};
const tabs=()=>['home',...(show('shop')?['shop']:[]),...(show('support')?['support']:[]),...(S.is_admin?['admin']:[])];
function drawNav(){const t=tabs(),k=t.join(),nv=$('#nv');if(k!==navKey){navKey=k;nv.innerHTML=`<div class="nb"><i class="ind" style="width:calc((100% - 12px)/${t.length})"></i>${t.map(x=>`<button data-a="go" data-v="${x}"><svg viewBox="0 0 24 24">${ICO[x]}</svg>${NAME[x]}</button>`).join('')}</div>`}
 const i=Math.max(0,t.indexOf(V));nv.querySelector('.ind').style.transform=`translateX(${i*100}%)`;nv.querySelectorAll('button').forEach((b,j)=>b.classList.toggle('on',j===i))}
const pills=(l,cur,a)=>`<div class="pills" id="pl"><i class="pi"></i>${l.map(([k,t])=>`<button class="pl ${k===cur?'on':''}" data-a="${a}" data-k="${k}">${t}</button>`).join('')}</div>`;
function moveInd(now){const pl=$('#pl');if(!pl)return;const b=pl.querySelector('.pl.on'),i=pl.querySelector('.pi');if(!b||!i)return;
 if(now)i.style.transition='none';i.style.width=b.offsetWidth+'px';i.style.transform=`translateX(${b.offsetLeft}px)`;if(now){void i.offsetWidth;i.style.transition=''}}
function sub(e,set,fn){const pl=$('#pl'),bs=[...pl.querySelectorAll('.pl')],o=bs.findIndex(b=>b.classList.contains('on')),n=bs.indexOf(e);if(o===n)return;hap('s');set(e.dataset.k);
 bs.forEach(b=>b.classList.toggle('on',b===e));moveInd();try{pl.scrollTo({left:Math.max(0,e.offsetLeft-(pl.clientWidth-e.offsetWidth)/2),behavior:'smooth'})}catch(x){}
 const pc=$('#pc');pc.style.setProperty('--d',n>o?1:-1);pc.innerHTML=fn();pc.classList.remove('swp');void pc.offsetWidth;pc.classList.add('swp');sbar()}
function refresh(){const pc=$('#pc');drawNav();if(pc&&V==='shop')pc.innerHTML=shopC();else if(pc&&V==='admin'&&AD)pc.innerHTML=adminC();else render();sbar()}
function render(fresh){
 clearInterval(tick);clearInterval(poll);const m=$('#m');
 if(!S){m.innerHTML='<div class="mid">Загрузка…</div>';return}
 if(S.blocked){const sb=S.blocked==='sub';navKey='';$('#nv').innerHTML='';m.innerHTML=`<div class="mid"><div style="font-size:44px">${sb?'📢':S.blocked==='banned'?'🚫':'🛠'}</div><h1>${sb?'Подпишитесь на канал':S.blocked==='banned'?'Доступ закрыт':'Технические работы'}</h1><div>${esc(S.text||'Чтобы пользоваться Orenix, подпишитесь на наш канал.')}</div>${sb?`<button class="btn" data-a="link" data-u="${esc(S.link)}">Подписаться</button><button class="btn g" data-a="reload">Я подписался</button>`:''}</div>`;return}
 drawNav();const p=S.profile,sl=($('#pl')||{}).scrollLeft||0;m.classList.remove('in');m.innerHTML=adH()+{home,shop:shopV,support,admin:adminV}[V]();
 if(fresh){void m.offsetWidth;m.classList.add('in')}
 const pl=$('#pl');if(pl){const b=pl.querySelector('.pl.on');pl.scrollLeft=fresh&&b?Math.max(0,b.offsetLeft-(pl.clientWidth-b.offsetWidth)/2):sl;moveInd(true)}
 if(V==='home'&&!p){poll=setInterval(async()=>{const j=await api('state');if(j.ok&&(JSON.stringify(j.reg)!==JSON.stringify(S.reg)||j.profile)){S=j;render(true)}},3000);
  if(S.reg&&S.reg.code&&S.reg.left>0)tick=setInterval(()=>{S.reg.left--;const e=$('#t');if(e)e.textContent=Math.floor(S.reg.left/60)+':'+String(S.reg.left%60).padStart(2,'0');if(S.reg.left<=0)load()},1000)}
 sbar()}
const adHide=()=>{try{return localStorage.getItem('adc')===String(S.ad.version)}catch(e){return false}};
const adH=()=>{const a=S.ad;if(!a||adHide())return'';return`<div class="ad" id="ad" data-a="adopen"><div class="adb"><div class="adh"><span class="adl">${esc(a.label)}</span>${a.advertiser?`<b>${esc(a.advertiser)}</b>`:''}${a.whatText&&a.whatBody?`<button class="adw" data-a="adwhat">${esc(a.whatText)}</button>`:''}</div><div class="adt">${esc(a.text)}</div></div>${a.closable?'<button class="adx" data-a="adx" aria-label="Закрыть">✕</button>':''}</div>`};
const items=l=>l.length?l.map(x=>`<div class="item" data-a="copy" data-c="${esc(x)}"><span>${esc(x)}</span><i>копировать</i></div>`).join(''):'<div class="sub">—</div>';
const more=(a,n,k)=>a.length>n?`<button class="more" data-a="more" data-k="${k}">${SH[k]?'Свернуть':'Показать все ('+a.length+')'}</button>`:'';
function home(){const p=S.profile;
 if(p){const pr=left(p.premium_until),nm=p.names,ph=SH.ph?p.phones:p.phones.slice(0,3);
 return`<div class="hc"><div class="av"${p.avatar?` style="background-image:url('${esc(p.avatar).replace(/'/g,'%27')}')"`:''}>${p.avatar?'':esc((p.name||'O')[0].toUpperCase())}</div><div class="hm"><h1>${esc(p.name)}</h1><div class="meta"><span>${PB} ${p.is_premium?(pr?'осталось '+pr:'бессрочно'):'нет Premium'}</span><span class="bal">${p.balance} ${ci}</span></div></div><button class="go" data-a="site" aria-label="Сайт"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button></div>
 <div class="card main-num"><h3>Номера</h3>${items(ph)}${more(p.phones,3,'ph')}</div>
 <div class="card"><h3>Юзернеймы</h3><div class="chips">${nm.length?nm.map(x=>`<span class="chp" data-a="copy" data-c="${esc(x)}">${esc(x)}</span>`).join(''):'<span class="sub">—</span>'}</div></div>`}
 if(!show('get_number'))return'<div class="mid"><div style="font-size:44px">🔒</div><div>Раздел временно недоступен</div></div>';
 const r=S.reg;
 if(r&&r.state==='pending')return`<h2>⏳ Запрос отправлен</h2><div class="card"><div class="sub">Ожидайте одобрения администратора. Как только запрос подтвердят — номер появится здесь автоматически.</div></div>`;
 if(r&&r.state==='denied')return`<h2>❌ Запрос отклонён</h2><div class="card"><div class="sub">Администратор отклонил выдачу номера. Если считаете это ошибкой — напишите в поддержку.</div></div>`;
 if(!r)return`<h2>${lock('get_number')}Получите номер Orenix</h2><div class="card"><div class="sub">Выберите регион — мы сгенерируем номер для регистрации в мессенджере.</div></div><div class="row"><button class="btn" data-a="reg" data-r="7">🇷🇺 +7</button><button class="btn" data-a="reg" data-r="1">🇺🇸 +1</button></div>`;
 return`<h2>Ваш номер</h2><div class="card main-num" data-a="copy" data-c="${r.body}"><div class="sub">${esc(r.region)}</div><div class="big">${esc(r.body)}</div><div class="sub" style="margin-top:6px">нажмите, чтобы скопировать</div></div>
 <div class="card sub">1. Откройте Orenix Messenger → «Регистрация»<br>2. Введите регион и номер, нажмите «Далее»<br>3. Вернитесь сюда и получите код</div>
 ${r.code&&r.left>0?`<div class="card"><h3>Код подтверждения</h3><div class="code" data-a="copy" data-c="${r.code}">${r.code}</div><div class="sub" style="text-align:center">действует <b id="t">${Math.floor(r.left/60)}:${String(r.left%60).padStart(2,'0')}</b></div></div>`:
 `<button class="btn ${r.entered?'':'dis'}" data-a="code">${r.entered?(r.expired?'Получить новый код':'Получить код'):'🔒 Получить код'}</button>${r.entered?'':'<div class="sub" style="text-align:center;margin-top:8px">Кнопка включится, когда вы введёте номер на сайте</div>'}`}
 ${S.messenger_url?`<button class="btn g" data-a="link" data-u="${esc(S.messenger_url)}">Открыть мессенджер</button>`:''}`}
const info=(i,t,d,b)=>`<div class="card info"><div class="ih"><div class="ib">${i}</div><div><b>${t}</b><div class="sub">${d}</div></div></div><ul>${b.map(x=>`<li>${x}</li>`).join('')}</ul></div>`;
const ST=[['num','shop_number','Номер'],['usr','shop_username','NFT-юз'],['prem','shop_premium','Premium'],['coin','shop_coins','Cat Coin']];
function shopV(){
 if(!S.profile)return'<div class="mid"><div>Сначала получите номер и зарегистрируйтесь</div><button class="btn" data-a="go" data-v="home">Получить номер</button></div>';
 const v=ST.filter(x=>show(x[1]));if(!v.length)return'<div class="mid">Нет доступных разделов</div>';
 if(!v.find(x=>x[0]===shop))shop=v[0][0];
 return pills(v.map(x=>[x[0],lock(x[1])+x[2]]),shop,'st')+`<div id="pc">${shopC()}</div>`}
const shopC=()=>({num,usr,coin,prem}[shop])();
const payBtn=(k,key,v,x='')=>`<button class="btn ${v==null?'dis':''}" data-a="pay" data-k="${k}"${x}>Оплатить ${pr2(key,v)}${bdg(key,v)}</button>`;
function num(){const P=S.prices,k=mode==='r'?'num_rand':'num_custom';
 return info('📞','Номер Orenix','Короткий номер из 4 цифр после кода региона — запоминается с первого раза.',['Появляется в вашем профиле сразу после оплаты','Рандом — случайный свободный, Свой — выбираете сами','Занятые номера мы отсеиваем автоматически'])+
 `<div class="seg"><div class="${mode==='r'?'on':''}" data-a="mode" data-m="r">🎲 Рандом · ${pr2('num_rand',P.num_rand)}</div><div class="${mode==='c'?'on':''}" data-a="mode" data-m="c">✍️ Свой · ${pr2('num_custom',P.num_custom)}</div></div>
 <div class="card"><div class="sub">Код региона</div><input id="rc" inputmode="numeric" maxlength="3" placeholder="например 7" value="7">${mode==='c'?'<div class="sub" style="margin-top:10px">4 цифры номера</div><input id="dg" inputmode="numeric" maxlength="4" placeholder="1234">':''}</div>`+payBtn(mode==='r'?'numr':'numc',k,P[k])}
function usr(){const P=S.prices.username;
 return info('🏷','NFT-юзернейм','Уникальный @юзернейм, который существует в единственном экземпляре.',['4–10 символов: латиница, цифры и _','Никто другой не получит такой же','Чем короче имя — тем оно ценнее'])+
 `<div class="card"><div class="sub">Желаемый юзернейм</div><input id="un" maxlength="10" placeholder="@username" autocapitalize="off"></div>`+payBtn('usr','username',P)}
function prem(){const P=Object.entries(S.prices.premium).sort((a,b)=>a[0]-b[0]);
 return info('⭐','Orenix Premium','Расширенные возможности мессенджера. Срок суммируется при продлении.',['До 20 своих чатов и каналов вместо 3','Анимированные стикеры, реакции и эмодзи в имени','Истории без ограничений и мессенджер без рекламы'])+
 `<div class="grid g2">${P.map(([d,v],i)=>`<button class="pk ${v==null?'dis':''}" data-a="pay" data-k="prem" data-d="${d}">${bdg('prem:'+d,v)}${pb(i)}<div><b>${d} дн.</b><br><span>${pr2('prem:'+d,v)}</span></div></button>`).join('')}</div>`}
function coin(){return info(ci,'Cat Coin','Внутренняя валюта Orenix. Курс: 1 ⭐ = 100 кк.',['Ставки на аукционах NFT','Покупка, улучшение и продажа подарков и NFT','Зачисляются на баланс сразу после оплаты'])+
 `<div class="grid g3">${S.prices.coins.map((c,i)=>`<button class="pk ${c.stars==null?'dis':''}" data-a="pay" data-k="coin" data-i="${i}">${bdg('coin:'+c.coins,c.stars)}${ci}<b>${c.coins}</b><span>${pr2('coin:'+c.coins,c.stars)}</span></button>`).join('')}</div>`}
const FAQ=[['Как получить номер?','На главной выберите регион — появится номер. Введите его в мессенджере («Регистрация»), нажмите «Далее» и вернитесь сюда за кодом.'],['Где мои покупки?','Номера и юзернеймы — в профиле на главной и в мессенджере, коины и Premium — на балансе, всё сразу после оплаты.'],['Оплатил, но ничего не пришло','Если выдать товар не удалось, звёзды вернутся автоматически. Если этого не случилось — напишите нам и укажите время оплаты.'],['Что такое ⭐ Stars?','Внутренняя валюта Telegram. Купить её можно прямо в Telegram через App Store или Google Play.'],['Продлевается ли Premium?','Да. Новый срок прибавляется к оставшемуся, ничего не сгорает.']];
function support(){return`<h2>Поддержка</h2><div class="card"><h3>Частые вопросы</h3>${FAQ.map((f,i)=>`<div class="fq ${FQ===i?'o':''}" data-a="fq" data-i="${i}"><div class="q"><span>${f[0]}</span><i>+</i></div><div class="a"><div>${f[1]}</div></div></div>`).join('')}</div>
 <div class="card"><h3>Не нашли ответ?</h3><div class="sub">Опишите проблему — ответ придёт в чат с ботом.</div><textarea id="sp" maxlength="2000" placeholder="Ваше сообщение…"></textarea></div><button class="btn" data-a="send">Отправить</button>`}
const AT=[['pr','Цены'],['vs','Видимость'],['mt','Работы'],['bn','Баны'],['am','Админы'],['lk','Привязки'],['bc','Рассылка'],['ss','Статистика']];
function adminV(){if(!AD)return'<div class="mid">Загрузка…<button class="btn g" data-a="adreload">Повторить</button></div>';return pills(AT,adm,'at')+`<div id="pc">${adminC()}</div>`}
const adminC=()=>({pr:apr,vs:avs,mt:amt,bn:abn,am:aam,lk:alk,bc:abc,ss:ass}[adm])();
function apr(){const P=S.prices,r=[['num_rand','Номер · рандом',P.num_rand,'num_rand'],['num_custom','Номер · свой',P.num_custom,'num_custom'],['username','NFT-юз',P.username,'username'],...Object.entries(P.premium).sort((a,b)=>a[0]-b[0]).map(([d,v])=>['prem:'+d,'Premium · '+d+' дн.',v,'prem:'+d]),...P.coins.map((c,i)=>['coin:'+i,c.coins+' кк',c.stars,'coin:'+c.coins])];
 return'<div class="card">'+r.map(([k,l,v,o])=>`<div class="pr" data-a="pe" data-k="${k}"><span>${l}</span><b>${pr2(o,v)}</b></div>${ed===k?`<div class="ped"><input id="pv" inputmode="numeric" placeholder="цена в ⭐" value="${v??''}"><div class="row"><button class="btn" data-a="psave" data-k="${k}">Сохранить</button><button class="btn g" data-a="psave" data-k="${k}" data-n="1">Прочерк —</button></div>${k.startsWith('coin:')?`<button class="btn r" data-a="pdel" data-i="${k.slice(5)}">Удалить пак</button>`:''}</div>`:''}`).join('')+`</div><div class="card"><h3>Новый пак Cat Coin</h3><input id="pc1" inputmode="numeric" placeholder="Количество кк, например 3000"><input id="pc2" inputmode="numeric" placeholder="Цена в ⭐ (пусто — прочерк)"><button class="btn" data-a="padd">Добавить пак</button></div>`}
const sw=(k,l,on,a)=>`<div class="sw" data-a="${a}" data-k="${k}"><span>${l}</span><i class="${on?'on':''}"></i></div>`;
const avs=()=>'<div class="sub" style="margin:0 4px 10px">Выключенные разделы скрыты от пользователей, админы видят их с 🔒.</div><div class="card">'+Object.entries(SEC).map(([k,l])=>sw(k,l,!hid(k),'hide')).join('')+'</div>';
function amt(){const m=AD.maintenance;return`<div class="card">${sw('mt','Технические работы',m.on,'mtt')}</div><div class="card"><h3>Текст для пользователей</h3><textarea id="mx">${esc(m.text)}</textarea><button class="btn" data-a="mtsave">Сохранить текст</button></div><div class="card"><h3>Ссылка на мессенджер</h3><input id="mu" value="${esc(AD.messenger_url)}" placeholder="https://…"><button class="btn g" data-a="musave">Сохранить ссылку</button></div>`}
const lst=a=>a.length?a.join(''):'<div class="sub">Список пуст</div>';
const abn=()=>`<div class="card"><h3>Telegram ID или @username</h3><input id="bq" placeholder="123456789"><div class="row"><button class="btn r" data-a="ban" data-b="ban">Забанить</button><button class="btn g" data-a="ban" data-b="unban">Разбанить</button></div></div><div class="card"><h3>В бане</h3>${lst(AD.banned.map(x=>`<div class="item" data-a="copy" data-c="${x.tg_id}"><span>${x.tg_id} ${esc(x.username?'@'+x.username:'')}</span><i>копировать</i></div>`))}</div>`;
const aam=()=>`<div class="card"><h3>Telegram ID или @username</h3><input id="aq" placeholder="123456789"><div class="row"><button class="btn" data-a="amadd">Добавить</button><button class="btn g" data-a="amdel">Удалить</button></div></div><div class="card"><h3>Админы</h3>${lst([...AD.admins.main.map(x=>`<div class="item"><span>${x}</span><i>главный</i></div>`),...AD.admins.extra.map(x=>`<div class="item"><span>${x}</span><i>админ</i></div>`)])}</div>`;
const alk=()=>`<div class="card"><h3>Привязать аккаунт сайта к Telegram</h3><input id="li" inputmode="numeric" placeholder="Telegram ID"><input id="lq" placeholder="+7 912 345 678 9 или @username"><button class="btn" data-a="lkadd">Привязать</button></div><div class="card"><h3>Привязки</h3>${lst(AD.links.map(x=>`<div class="item" data-a="lkdel" data-k="${x.tg}"><span>${x.tg} → ${esc(x.label)}</span><i>убрать</i></div>`))}</div>`;
