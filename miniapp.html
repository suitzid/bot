<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Orenix</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0d1512;--sc:#16211f;--card:#1f2c29;--line:#263230;--tx:#f2f4ef;--t2:#8b968f;--t3:#6d7873;--ac:#4fd6b4;--fill:#2eb896;--dk:#0d1f1a;--bad:#e2716a;--glass:rgba(255,255,255,.06);--gb:rgba(255,255,255,.12)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px 6px}
header b{font-size:20px;letter-spacing:.2px}
.chip{background:var(--glass);border:1px solid var(--gb);border-radius:99px;padding:5px 12px;font-size:13px;font-variant-numeric:tabular-nums}
main{flex:1;padding:8px 16px 96px}
h1{font-size:22px;margin:4px 0}h2{font-size:18px;margin:10px 2px 12px}h3{font-size:13px;color:var(--t2);font-weight:600;margin-bottom:8px}
.sub{color:var(--t2);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:12px}
.hero{display:flex;gap:14px;align-items:center;margin:6px 2px 16px}
.av{width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,var(--fill),#4a7cf0);display:grid;place-items:center;font-size:24px;font-weight:700;color:#fff}
.main-num{border-left:3px solid var(--ac);background:linear-gradient(90deg,rgba(79,214,180,.12),transparent)}
.big{font-size:26px;font-weight:700;letter-spacing:.5px;font-variant-numeric:tabular-nums;word-break:break-all}
.item{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid var(--line);cursor:pointer;font-variant-numeric:tabular-nums}
.item:first-of-type{border-top:0}.item i{font-style:normal;color:var(--t3);font-size:12px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;font:600 16px inherit;font-family:inherit;background:var(--fill);color:var(--dk);cursor:pointer;margin-top:10px}
.btn.g{background:var(--glass);color:var(--tx);border:1px solid var(--gb)}.btn.dis{opacity:.45;pointer-events:none}
.row{display:flex;gap:10px}.row>*{flex:1}
.tile{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:10px;color:var(--tx);font:inherit;cursor:pointer}
.tile .e{font-size:26px}.tile b{display:block;font-size:16px}.tile span{color:var(--t2);font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pk{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:center;color:var(--tx);font:inherit;cursor:pointer}
.pk b{display:block;font-size:18px}.pk span{color:var(--ac);font-size:14px}.pk.dis{opacity:.45;pointer-events:none}
input,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:13px;color:var(--tx);font:inherit;margin-top:8px;outline:0}
input:focus,textarea:focus{border-color:var(--ac)}textarea{min-height:130px;resize:none}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;margin-bottom:10px}
.seg div{flex:1;text-align:center;padding:9px;border-radius:10px;color:var(--t2);cursor:pointer}.seg .on{background:var(--glass-a,rgba(46,184,150,.25));color:var(--tx)}
.code{font-size:44px;font-weight:800;letter-spacing:10px;text-align:center;color:var(--ac);margin:6px 0;font-variant-numeric:tabular-nums;cursor:pointer}
.mid{display:grid;place-items:center;text-align:center;padding:60px 24px;color:var(--t2);gap:10px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:8px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 35%)}
nav div{display:flex;gap:6px;width:100%;max-width:496px;background:var(--sc);border:1px solid var(--gb);border-radius:22px;padding:6px}
nav button{flex:1;border:0;background:none;color:var(--t3);padding:8px 4px;border-radius:16px;font:12px inherit;font-family:inherit;cursor:pointer}
nav button svg{display:block;margin:0 auto 2px;width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{background:rgba(46,184,150,.25);color:var(--ac)}
#toast{position:fixed;left:50%;top:18px;transform:translate(-50%,-90px);background:var(--sc);border:1px solid var(--gb);padding:11px 18px;border-radius:14px;transition:.25s;z-index:9;max-width:88%;text-align:center}
#toast.s{transform:translate(-50%,0)}
.back{color:var(--ac);background:none;border:0;font:inherit;padding:6px 2px;cursor:pointer}
.warn{color:var(--bad);font-size:13px;margin-top:6px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div id="app"></div><div id="toast"></div>
<script>
const tg=Telegram.WebApp;tg.ready();tg.expand();try{tg.setHeaderColor('#0d1512');tg.setBackgroundColor('#0d1512')}catch(e){}
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S=null,V='home',mode='r',tick=null,poll=null,busy=false;
const ps=v=>v==null?'—':v+' ⭐';
async function api(n,b){try{const r=await fetch('/api/'+n,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...b,init:tg.initData})});return await r.json()}catch(e){return{error:'Нет связи с сервером'}}}
function toast(m){const t=$('#toast');t.textContent=m;t.className='s';clearTimeout(t._t);t._t=setTimeout(()=>t.className='',2600)}
async function load(){const j=await api('state');if(j.error)return toast(j.error);S=j;render()}
async function act(n,b){if(busy)return;busy=true;const j=await api(n,b);busy=false;if(j.error){toast(j.error);return null}if(j.blocked||j.ok&&'profile' in j){S=j;render()}return j}
const hid=k=>S.hidden[k],show=k=>!hid(k)||S.is_admin,lock=k=>hid(k)?'🔒 ':'';
function left(u){if(!u)return null;const d=new Date(u)-Date.now();if(d<=0)return null;return Math.floor(d/864e5)+' д '+Math.floor(d%864e5/36e5)+' ч'}
function render(){
 clearInterval(tick);clearInterval(poll);const a=$('#app');
 if(!S){a.innerHTML='<div class="mid">Загрузка…</div>';return}
 if(S.blocked){const sub=S.blocked==='sub';a.innerHTML=`<div class="mid"><div style="font-size:44px">${sub?'📢':S.blocked==='banned'?'🚫':'🛠'}</div><h1>${sub?'Подпишитесь на канал':S.blocked==='banned'?'Доступ закрыт':'Технические работы'}</h1><div>${esc(S.text||'Чтобы пользоваться Orenix, подпишитесь на наш канал.')}</div>${sub?`<button class="btn" data-a="link" data-u="${esc(S.link)}">Подписаться</button><button class="btn g" data-a="reload">Я подписался</button>`:''}</div>`;return}
 const p=S.profile,nav=[['home','Главная','<path d="M4 11l8-7 8 7v9H4z"/>'],...(show('shop')?[['shop','Магазин','<path d="M5 8h14l-1 12H6zM9 8a3 3 0 016 0"/>']]:[]),...(show('support')?[['support','Поддержка','<path d="M4 5h16v11H9l-5 4z"/>']]:[])];
 const body={home:home,shop:shop,num:num,usr:usr,coin:coin,prem:prem,support:support}[V]();
 a.innerHTML=`<header><b>Orenix</b>${p?`<span class="chip">🪙 ${p.balance}</span>`:''}</header><main>${body}</main><nav><div>${nav.map(n=>`<button class="${V===n[0]||(V.length&&n[0]==='shop'&&['num','usr','coin','prem'].includes(V))?'on':''}" data-a="go" data-v="${n[0]}"><svg viewBox="0 0 24 24">${n[2]}</svg>${n[1]}</button>`).join('')}</div></nav>`;
 if(V==='home'&&!p){poll=setInterval(async()=>{const j=await api('state');if(j.ok&&JSON.stringify(j.reg)!==JSON.stringify(S.reg)||j.profile){S=j;render()}},3000)}
 if(S.reg&&S.reg.code&&S.reg.left>0&&V==='home'&&!p){tick=setInterval(()=>{S.reg.left--;const e=$('#t');if(e)e.textContent=Math.floor(S.reg.left/60)+':'+String(S.reg.left%60).padStart(2,'0');if(S.reg.left<=0)load()},1000)}
}
const items=l=>l.length?l.map((x,i)=>`<div class="item" data-a="copy" data-c="${esc(x)}"><span>${esc(x)}</span><i>копировать</i></div>`).join(''):'<div class="sub">—</div>';
function home(){
 const p=S.profile;
 if(p){const pr=left(p.premium_until);return`<div class="hero"><div class="av">${esc((p.name||'O')[0].toUpperCase())}</div><div><h1>${esc(p.name)}</h1><div class="sub">${p.is_premium&&pr?'💎 Premium · осталось '+pr:'Premium не активен'}</div></div></div>
 <div class="card main-num"><h3>Номера</h3>${items(p.phones)}</div><div class="card"><h3>Юзернеймы</h3>${items(p.names)}</div>
 <div class="card"><h3>Cat Coin</h3><div class="big">🪙 ${p.balance}</div></div>${show('shop')?'<button class="btn" data-a="go" data-v="shop">Открыть магазин</button>':''}`}
 if(!show('get_number'))return'<div class="mid"><div style="font-size:44px">🔒</div><div>Раздел временно недоступен</div></div>';
 const r=S.reg;
 if(!r)return`<h2>${lock('get_number')}Получите номер Orenix</h2><div class="card"><div class="sub">Выберите регион — мы сгенерируем номер для регистрации в мессенджере.</div></div><div class="row"><button class="btn" data-a="reg" data-r="7">🇷🇺 +7</button><button class="btn" data-a="reg" data-r="1">🇺🇸 +1</button></div>`;
 return`<h2>Ваш номер</h2><div class="card main-num" data-a="copy" data-c="${r.body}"><div class="sub">${esc(r.region)}</div><div class="big">${esc(r.body)}</div><div class="sub" style="margin-top:6px">нажмите, чтобы скопировать</div></div>
 <div class="card sub">1. Откройте Orenix Messenger → «Регистрация»<br>2. Введите регион и номер, нажмите «Далее»<br>3. Вернитесь сюда и получите код</div>
 ${r.code&&r.left>0?`<div class="card"><h3>Код подтверждения</h3><div class="code" data-a="copy" data-c="${r.code}">${r.code}</div><div class="sub" style="text-align:center">действует <b id="t">${Math.floor(r.left/60)}:${String(r.left%60).padStart(2,'0')}</b></div></div>`:
 `<button class="btn ${r.entered?'':'dis'}" data-a="code">${r.entered?(r.expired?'Получить новый код':'Получить код'):'🔒 Получить код'}</button>${r.entered?'':'<div class="sub" style="text-align:center;margin-top:8px">Кнопка включится, когда вы введёте номер на сайте</div>'}`}
 ${S.messenger_url?`<button class="btn g" data-a="link" data-u="${esc(S.messenger_url)}">Открыть мессенджер</button>`:''}`}
function shop(){
 if(!S.profile)return'<div class="mid"><div>Сначала получите номер и зарегистрируйтесь</div><button class="btn" data-a="go" data-v="home">Получить номер</button></div>';
 const t=[['shop_number','📞','Номер','Красивый номер из 4 цифр','num'],['shop_username','🏷','NFT-юз','Уникальный юзернейм','usr'],['shop_coins','🪙','Cat Coin','1 ⭐ = 100 кк','coin'],['shop_premium','💎','Orenix Premium','Расширенные возможности','prem']];
 return'<h2>Магазин</h2>'+t.filter(x=>show(x[0])).map(x=>`<button class="tile" data-a="go" data-v="${x[4]}"><div class="e">${x[1]}</div><div><b>${lock(x[0])}${x[2]}</b><span>${x[3]}</span></div></button>`).join('')}
const bk='<button class="back" data-a="go" data-v="shop">← Магазин</button>';
function num(){const P=S.prices;return`${bk}<h2>Номер из 4 цифр</h2><div class="seg"><div class="${mode==='r'?'on':''}" data-a="mode" data-m="r">🎲 Рандом · ${ps(P.num_rand)}</div><div class="${mode==='c'?'on':''}" data-a="mode" data-m="c">✍️ Свой · ${ps(P.num_custom)}</div></div>
 <div class="card"><div class="sub">Код региона</div><input id="rc" inputmode="numeric" maxlength="3" placeholder="например 7" value="7">${mode==='c'?'<div class="sub" style="margin-top:10px">4 цифры номера</div><input id="dg" inputmode="numeric" maxlength="4" placeholder="1234">':''}</div>
 <button class="btn ${P[mode==='r'?'num_rand':'num_custom']==null?'dis':''}" data-a="pay" data-k="${mode==='r'?'numr':'numc'}">Оплатить ${ps(P[mode==='r'?'num_rand':'num_custom'])}</button><div class="sub" style="text-align:center;margin-top:8px">Номер сразу придёт на ваш аккаунт</div>`}
function usr(){const P=S.prices.username;return`${bk}<h2>NFT-юзернейм</h2><div class="card"><div class="sub">4–10 символов: латиница, цифры, _</div><input id="un" maxlength="10" placeholder="@username" autocapitalize="off"></div><button class="btn ${P==null?'dis':''}" data-a="pay" data-k="usr">Оплатить ${ps(P)}</button>`}
function coin(){return`${bk}<h2>Cat Coin</h2><div class="sub" style="margin:-6px 2px 12px">Курс: 1 ⭐ = 100 кк</div><div class="grid">${S.prices.coins.map((c,i)=>`<button class="pk ${c.stars==null?'dis':''}" data-a="pay" data-k="coin" data-i="${i}"><b>🪙 ${c.coins}</b><span>${ps(c.stars)}</span></button>`).join('')}</div>`}
function prem(){const e=Object.entries(S.prices.premium).sort((a,b)=>a[0]-b[0]);return`${bk}<h2>Orenix Premium</h2>${e.map(([d,v])=>`<button class="tile ${v==null?'dis':''}" data-a="pay" data-k="prem" data-d="${d}"><div class="e">💎</div><div style="flex:1"><b>${d} дней</b></div><b style="color:var(--ac)">${ps(v)}</b></button>`).join('')}`}
function support(){return`<h2>Поддержка</h2><div class="card"><div class="sub">Опишите проблему — ответ придёт в чат с ботом.</div><textarea id="sp" maxlength="2000" placeholder="Ваше сообщение…"></textarea></div><button class="btn" data-a="send">Отправить</button>`}
const A={
 go(e){V=e.dataset.v;render();scrollTo(0,0)},reload(){load()},
 link(e){const u=e.dataset.u;u.includes('t.me')?tg.openTelegramLink(u):tg.openLink(u)},
 copy(e){navigator.clipboard&&navigator.clipboard.writeText(e.dataset.c);try{tg.HapticFeedback.notificationOccurred('success')}catch(x){}toast('Скопировано')},
 mode(e){mode=e.dataset.m;render()},
 async reg(e){await act('reg_start',{region:e.dataset.r})},
 async code(){await act('reg_code',{})},
 async send(){const t=$('#sp').value.trim();if(t.length<3)return toast('Напишите сообщение');const j=await act('support',{text:t});if(j){$('#sp').value='';toast('Обращение отправлено ✅')}},
 async pay(e){const d=e.dataset,b={kind:d.k};if(d.k==='numr'||d.k==='numc'){b.code=$('#rc').value.trim();if(d.k==='numc')b.digits=$('#dg').value.trim()}
  if(d.k==='usr')b.name=$('#un').value.trim().replace(/^@/,'');if(d.k==='coin')b.idx=+d.i;if(d.k==='prem')b.days=d.d;
  const j=await act('pay',b);if(j&&j.link)tg.openInvoice(j.link,s=>{if(s==='paid'){toast('Оплачено ✅');setTimeout(load,1500)}else if(s==='failed')toast('Оплата не прошла')})}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(el)A[el.dataset.a](el)});
load();
</script></body></html>
